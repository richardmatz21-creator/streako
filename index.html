<style>
:root{
  --green:#58B21C; --green-d:#438A14; --green-l:#E8F6DC;
  --blue:#1CA0E3;  --blue-d:#1580B8;  --blue-l:#E2F4FD;
  --amber:#FFB020; --amber-d:#D18A00; --amber-l:#FFF3D9;
  --red:#F04A4A;   --red-d:#C23535;   --red-l:#FDE6E6;
  --orange:#FF8A1F;
  --gray:#E5E5E5;  --gray-d:#C7C7C7;  --muted:#8A8A8A;
  --text:#3C3C3C;  --bg:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;font-weight:600}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#app{max-width:480px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 16px}
h1,h2,h3{font-weight:900;margin:0}
h2{font-size:20px;margin:20px 0 10px}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font:inherit;font-weight:900;font-size:15px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;
  background:var(--green);color:#fff;border-bottom:4px solid var(--green-d);transition:transform .05s}
.btn:active{transform:translateY(3px);border-bottom-width:1px;margin-bottom:3px}
.btn.blue{background:var(--blue);border-bottom-color:var(--blue-d)}
.btn.red{background:var(--red);border-bottom-color:var(--red-d)}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--gray);border-bottom-width:4px}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:13px;border-radius:12px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.card{border:2px solid var(--gray);border-bottom-width:4px;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.card.hl{border-color:var(--amber);background:var(--amber-l)}
.card .t{font-weight:900;font-size:16px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px}
input,select{width:100%;font:inherit;font-size:16px;padding:12px;border:2px solid var(--gray);border-radius:12px;background:#F7F7F7;color:var(--text);margin:4px 0 10px}
label{font-size:14px;color:var(--muted)}
.topbar{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:18px;padding:4px 2px 12px}
.topbar span{display:flex;align-items:center;gap:4px}
.banner{background:var(--green);border-bottom:4px solid var(--green-d);color:#fff;border-radius:16px;padding:12px 16px;margin-bottom:8px}
.banner.pause{background:var(--blue);border-bottom-color:var(--blue-d)}
.banner small{display:block;opacity:.85;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.banner b{font-size:18px;font-weight:900}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 8px}
.node{width:76px;height:70px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;cursor:pointer;
  background:var(--gray);border-bottom:7px solid var(--gray-d)}
.node:active{transform:translateY(4px);border-bottom-width:3px}
.node.done{background:var(--green);border-bottom-color:var(--green-d)}
.node.wait{background:var(--amber);border-bottom-color:var(--amber-d)}
.node.open{background:var(--blue);border-bottom-color:var(--blue-d)}
.node.next{background:var(--amber);border-bottom-color:var(--amber-d);outline:5px solid #FFD98A;outline-offset:4px}
.node.bad{background:var(--red);border-bottom-color:var(--red-d)}
.nlabel{font-weight:800;font-size:14px;text-align:center;margin-bottom:10px;max-width:220px}
.nlabel small{display:block;color:var(--muted);font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--gray);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
.nav button{background:none;border:2px solid transparent;border-radius:12px;padding:6px 14px;font-size:26px;color:var(--muted);position:relative;cursor:pointer}
.nav button.on{color:var(--blue);border-color:var(--blue);background:var(--blue-l)}
.nav .dot{position:absolute;top:0;right:2px;background:var(--red);color:#fff;font-size:11px;font-weight:900;border-radius:10px;padding:1px 6px}
.rank{display:flex;align-items:center;gap:12px}
.rank .pos{font-size:20px;font-weight:900;width:22px}
.rank .nm{flex:1;font-weight:900;font-size:17px}
.pill{display:inline-flex;align-items:center;gap:3px;font-weight:900;font-size:14px}
.gem{color:var(--blue)}.fire{color:var(--orange)}.ice{color:#5BC0F0}
.proofimg{width:100%;border-radius:12px;background:#222;min-height:120px;display:block;margin:8px 0;object-fit:cover;max-height:340px}
.tag{display:inline-block;font-size:12px;font-weight:900;padding:3px 8px;border-radius:8px}
.tag.ok{background:var(--green-l);color:var(--green-d)}.tag.wait{background:var(--amber-l);color:var(--amber-d)}.tag.no{background:var(--red-l);color:var(--red-d)}
.big{font-size:40px;font-weight:900;text-align:center}
.center{text-align:center}
.empty{text-align:center;padding:24px 10px;color:var(--muted)}
.wd{display:flex;gap:4px;margin:4px 0 10px}.wd label{flex:1}
.wd input{display:none}.wd span{display:block;text-align:center;padding:9px 0;border:2px solid var(--gray);border-radius:10px;font-weight:900;color:var(--text)}
.wd input:checked+span{background:var(--blue);border-color:var(--blue-d);color:#fff}
.modal{position:fixed;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
.cam{position:relative;flex:1;background:#111;border-radius:18px;overflow:hidden;margin:10px 0;min-height:0}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam .hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;color:#fff;font-size:13px;font-weight:800}
.cam .hud span{background:rgba(0,0,0,.55);padding:5px 9px;border-radius:10px}
.shutter{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;border:6px solid #fff;background:rgba(255,255,255,.25);cursor:pointer}
.success{background:var(--green-l);color:var(--green-d);border-radius:16px;padding:16px;font-weight:900;text-align:center;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;z-index:30;max-width:90%;text-align:center}
.hidden{display:none!important}
.iconbtn{background:none;border:2px solid var(--gray);border-radius:10px;padding:5px 8px;font-size:16px;color:var(--muted);cursor:pointer;flex:none}
.hrow{padding:7px 0;border-bottom:2px solid var(--gray)}
.hrow>span:first-child{flex:1;min-width:0}
.hrow .r{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:4px;flex:none;max-width:48%}
.note{background:var(--amber-l);color:var(--amber-d);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
a{color:var(--blue)}
</style>
</head>

</nav>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dFmt = new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/Berlin', year:'numeric', month:'2-digit', day:'2-digit'});
const tFmt = new Intl.DateTimeFormat('de-DE', {timeZone:'Europe/Berlin', hour:'2-digit', minute:'2-digit', second:'2-digit'});
const dtFmt = new Intl.DateTimeFormat('de-DE', {timeZone:'Europe/Berlin', weekday:'short', day:'2-digit', month:'2-digit'});
const berlinDate = (d = new Date()) => dFmt.format(d);
const parts = s => s.split('-').map(Number);
const utc = s => { const [y,m,d] = parts(s); return Date.UTC(y, m-1, d); };
const addDays = (s, n) => new Date(utc(s) + n*864e5).toISOString().slice(0,10);
const diffDays = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
const isoDow = s => { const w = new Date(utc(s)).getUTCDay(); return w === 0 ? 7 : w; };
const weekStart = s => addDays(s, 1 - isoDow(s));
const DAYS = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const DAYS_LONG = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const prettyDate = s => dtFmt.format(new Date(utc(s) + 12*36e5));

function rangeText(days) {

  if (d.length === 1) return prettyDate(d[0]);
  return `${prettyDate(d[0])} – ${prettyDate(d[d.length - 1])} · ${d.length} Tage`;
}
// Pause-Tage nach Antrag gruppieren (ältere Einzeltage ohne group_id einzeln)
function groupPauses(list) {
  const m = new Map();
  for (const p of list) {
    const key = p.group_id || 'd:' + p.day;
    if (!m.has(key)) m.set(key, { key, group_id: p.group_id || null, user_id: p.user_id, days: [], approved: true });
    const g = m.get(key); g.days.push(p.day); if (!p.approved) g.approved = false;
  }
  return [...m.values()].map(g => (g.days.sort(), g)).sort((a, b) => a.days[0].localeCompare(b.days[0]));
}
const openDel = (kind, id) => S.delreqs.find(r => r.kind === kind && r.target_id === id && r.status === 'pending');

// ---------- Logik ----------
function dueOn(t, d) {
  if (!t.approved || !t.approved_at) return false;
  const from = t.start_date > berlinDate(new Date(t.approved_at)) ? t.start_date : berlinDate(new Date(t.approved_at));
  if (d < from) return false;
  if (t.archived_at && d >= berlinDate(new Date(t.archived_at))) return false;
  switch (t.repeat) {
    case 'daily': return true;
    case 'weekdays': return (t.weekdays || []).includes(isoDow(d));
    case 'once': return d === t.start_date;
    case 'interval': return diffDays(t.start_date, d) % t.every_days === 0;
  }
  return false;
}
function proofFor(taskId, d) {
  const list = S.proofs.filter(p => p.task_id === taskId && p.for_date === d);
  return list.find(p => p.status === 'approved') || list.find(p => p.status === 'pending') || list.find(p => p.status === 'rejected') || null;
}
function dueTasks(uid, d) {
  return S.tasks.filter(t => t.owner === uid && dueOn(t, d))
    .sort((a,b) => (a.due_time || '99').localeCompare(b.due_time || '99'));
}
function dayDone(uid, d) {
  const due = dueTasks(uid, d);
  return due.length > 0 && due.every(t => { const p = proofFor(t.id, d); return p && p.status !== 'rejected'; });
}
function isPause(uid, d) { return S.pauses.some(p => p.user_id === uid && p.day === d && p.approved); }

// Streak: Tage am Stück, an denen alles erledigt war. Tage ohne Aufgaben oder Pause-Tage zählen neutral.
// Pro Woche (Mo–So) rettet ein Joker einen verpassten Tag.
function streakOf(uid) {
  const today = berlinDate();
  const mine = S.tasks.filter(t => t.owner === uid && t.approved && t.approved_at);
  if (!mine.length) return { count:0, jokerLeft:1 };
  const earliest = mine.map(t => berlinDate(new Date(t.approved_at))).sort()[0];
  const used = {};
  let count = 0;
  if (!isPause(uid, today) && dayDone(uid, today)) count++;
  let d = addDays(today, -1);
  for (let i = 0; i < 800 && d >= earliest; i++, d = addDays(d, -1)) {
    if (isPause(uid, d) || dueTasks(uid, d).length === 0) continue;
    if (dayDone(uid, d)) { count++; continue; }
    const wk = weekStart(d);
    if (!used[wk]) { used[wk] = true; continue; }
    break;
  }
  return { count, jokerLeft: used[weekStart(today)] ? 0 : 1 };
}
function balanceOf(uid) {
  const plus = S.proofs.filter(p => p.user_id === uid && p.status === 'approved').reduce((a,p) => a + p.points, 0);
  const bonus = S.grants.filter(g => g.user_id === uid && g.status === 'approved').reduce((a,g) => a + g.amount, 0);
  const minus = S.redemptions.filter(r => r.user_id === uid).reduce((a,r) => a + r.cost, 0);
  return plus + bonus - minus;
}
function weekPoints(uid) {
  const ws = weekStart(berlinDate());
  return S.proofs.filter(p => p.user_id === uid && p.status === 'approved' && p.for_date >= ws).reduce((a,p) => a + p.points, 0);
}
function repeatText(t) {
  const time = t.due_time ? ` · ${t.due_time.slice(0,5)}` : '';
  switch (t.repeat) {
    case 'daily': return 'Jeden Tag' + time;
    case 'weekdays': return (t.weekdays || []).slice().sort().map(n => DAYS[n-1]).join(', ') + time;
    case 'once': return 'Nur am ' + prettyDate(t.start_date) + time;
    case 'interval': return `Alle ${t.every_days} Tage ab ${prettyDate(t.start_date)}` + time;
  }
  return '';
}
function todoCount() {
  const o = other(); if (!o) return 0;
  return S.proofs.filter(p => p.user_id === o.id && p.status === 'pending').length
    + S.tasks.filter(t => t.owner === o.id && !t.approved && !t.archived_at).length
    + groupPauses(S.pauses.filter(p => p.user_id === o.id && !p.approved)).length
    + S.rewards.filter(r => r.owner === o.id && !r.approved).length
    + S.redemptions.filter(r => r.user_id === o.id && !r.fulfilled).length
    + S.grants.filter(g => g.requested_by === o.id && g.status === 'pending').length
    + S.delreqs.filter(r => r.requested_by === o.id && r.status === 'pending').length;
}

// Supabase liefert max. 1000 Zeilen pro Abfrage – daher seitenweise laden
async function fetchAll(table, col, asc) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from(table).select('*').order(col, { ascending: asc }).order('id', { ascending: true }).range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) return out;
  }
}
async function loadAll() {
  const [players, tasks, proofs, rewards, redemptions, pauses] = await Promise.all([
    sb.from('players').select('*').order('created_at'),
    sb.from('tasks').select('*').order('created_at'),
    fetchAll('proofs', 'created_at', false),
    sb.from('rewards').select('*').order('cost'),
    fetchAll('redemptions', 'created_at', false),
    sb.from('pause_days').select('*').order('day'),
  ]);
  for (const r of [players, tasks, rewards, pauses]) if (r.error) throw r.error;
  S.players = players.data; S.tasks = tasks.data; S.proofs = proofs; S.rewards = rewards.data; S.redemptions = redemptions; S.pauses = pauses.data;
  // Neue Tabellen: fehlen sie (schema.sql noch nicht neu ausgeführt), läuft die App trotzdem weiter
  const opt = async table => { try { return { rows: await fetchAll(table, 'created_at', false) }; } catch (e) { return { rows: [], missing: true }; } };
  const [g, d] = await Promise.all([opt('diamond_grants'), opt('delete_requests')]);
  S.grants = g.rows; S.delreqs = d.rows; S.dbOld = !!(g.missing || d.missing);
  S.me = S.players.find(p => p.id === S.session.user.id) || null;
}
const dbHint = () => S.dbOld ? `<div class="note"><i class="ti ti-alert-triangle"></i> Datenbank-Update fehlt: <b>schema.sql</b> in Supabase im SQL Editor nochmal komplett ausführen.</div>` : '';

async function photoUrl(path) {
  if (!path) return null;
  const c = S.urls[path];
  if (c && c.until > Date.now()) return c.url;
  const { data } = await sb.storage.from('proofs').createSignedUrl(path, 3600);
  if (data) S.urls[path] = { url: data.signedUrl, until: Date.now() + 50 * 60000 };
  return data ? data.signedUrl : null;
}

function renderHome() {
  const today = berlinDate();

  let nextSet = false;
  const offs = [0, 70, 0, -70];
  const nodes = due.map((t, i) => {
    const p = proofFor(t.id, today);
    let cls = 'open', icon = 'ti-camera', sub = `+${t.points}`;
    if (p && p.status === 'approved') { cls = 'done'; icon = 'ti-check'; sub = `+${t.points} · bestätigt`; }
    else if (p && p.status === 'pending') { cls = 'wait'; icon = 'ti-hourglass'; sub = 'wird geprüft'; }
    else { if (p && p.status === 'rejected') sub = 'abgelehnt · nochmal'; if (!nextSet) { cls = 'next'; icon = 'ti-star'; nextSet = true; } }
    const tappable = !(p && p.status !== 'rejected');
    const time = t.due_time ? t.due_time.slice(0,5) + ' · ' : '';
    const ml = offs[i % 4];
    return `<button class="node ${cls}" style="margin-left:${ml}px" ${tappable ? `data-shoot="${t.id}"` : 'disabled'} aria-label="${esc(t.title)}"><i class="ti ${icon}"></i></button>
      <div class="nlabel" style="margin-left:${ml}px">${esc(t.title)}<small>${esc(time + sub)}</small></div>`;

    <div class="banner ${pause ? 'pause' : ''}"><small>${weekday}, ${prettyDate(today).split(', ')[1] || ''}</small><b>${pause ? 'Pause-Tag – Streak ist sicher' : (due.length ? (dayDone(S.me.id, today) ? 'Alles erledigt!' : 'Dein Tag') : 'Heute nichts dran')}</b></div>

      <div class="row2" style="margin-top:10px"><button class="btn red small" data-dr="${r.id}" data-ok="0">Zu billig</button><button class="btn small" data-dr="${r.id}" data-ok="1">Preis passt</button></div></div>`).join('');
  html += red.map(r => `<div class="card hl"><p class="muted">${esc(o.name)} hat eingelöst</p><div class="line"><span class="t">${esc(r.title)}</span><span class="pill gem"><i class="ti ti-diamond"></i>${r.cost}</span></div>
      <button class="btn small" style="margin-top:10px" data-fr="${r.id}">Erledigt</button></div>`).join('');
  // Eigene offene Anfragen (warten auf die andere Person)
  const myReq = [
    ...S.delreqs.filter(r => r.requested_by === S.me.id && r.status === 'pending').map(r =>
      `<div class="line hrow"><span>Löschen: ${esc(r.label)}<br><span class="muted">wartet auf ${esc(o.name)}</span></span><button class="btn ghost small" data-cd="${r.id}">Zurückziehen</button></div>`),
    ...S.grants.filter(g => g.requested_by === S.me.id && g.status === 'pending').map(g =>
      `<div class="line hrow"><span>+${g.amount} Diamanten für ${g.user_id === S.me.id ? 'dich' : esc(o.name)}: ${esc(g.reason)}<br><span class="muted">wartet auf ${esc(o.name)}</span></span><button class="btn ghost small" data-cg="${g.id}">Zurückziehen</button></div>`),
  ];
  if (myReq.length) html += `<h2>Deine Anfragen</h2>${myReq.join('')}`;
  const items = historyItems();
  const hist = items.slice(0, S.histN).map(histRow).join('');
  if (hist) html += `<h2>Verlauf</h2><p class="muted" style="margin:-4px 0 4px">Mit <i class="ti ti-trash"></i> fragst du eine Löschung an – die andere Person muss zustimmen.</p>${hist}`
    + (items.length > S.histN ? `<div style="height:10px"></div><button class="btn ghost" id="more">Mehr anzeigen (${items.length - S.histN})</button>` : '');
  $app.innerHTML = html;
  $app.querySelectorAll('[data-img]').forEach(async img => { const u = await photoUrl(img.dataset.img); if (u) img.src = u; else img.alt = 'Foto schon gelöscht'; });
  const me = S.me.name;
  // sel: Button-Selektor, fn: RPC, args(b): Parameter, msg(b, ok): [Titel, Text] für die Push-Nachricht
  const act = (sel, fn, args, msg) => $app.querySelectorAll(sel).forEach(b => b.onclick = async () => {
    b.disabled = true;
    const ok = b.dataset.ok === '1';
    const m = msg ? msg(b, ok) : null; // vor dem Neuladen bauen, solange die Daten noch da sind
    const { data, error } = await sb.rpc(fn, args(b, ok));
    if (error) { b.disabled = false; return toast(errMsg(error)); }
    if (fn === 'decide_delete' && data) { try { await sb.storage.from('proofs').remove([data]); } catch (_) {} }
    if (m) notify(m[0], m[1]);
    await refresh();
  });
  const taskOfProof = id => (S.tasks.find(t => t.id === (S.proofs.find(p => p.id === id) || {}).task_id) || {}).title || 'Beweis';
  act('[data-rp]', 'review_proof', (b, ok) => ({ p_id: b.dataset.rp, p_ok: ok }),
    (b, ok) => [ok ? 'Beweis bestätigt ✅' : 'Beweis abgelehnt ❌', `${me} hat „${taskOfProof(b.dataset.rp)}“ ${ok ? 'bestätigt' : 'abgelehnt'}`]);
  act('[data-dt]', 'decide_task', (b, ok) => ({ p_id: b.dataset.dt, p_ok: ok }),
    (b, ok) => [ok ? 'Challenge angenommen' : 'Challenge abgelehnt', `„${(S.tasks.find(t => t.id === b.dataset.dt) || {}).title || ''}“`]);
  act('[data-dr]', 'decide_reward', (b, ok) => ({ p_id: b.dataset.dr, p_ok: ok }),
    (b, ok) => [ok ? 'Preis bestätigt' : 'Preis abgelehnt', `„${(S.rewards.find(r => r.id === b.dataset.dr) || {}).title || ''}“`]);
  act('[data-fr]', 'fulfill_redemption', b => ({ p_id: b.dataset.fr }),
    b => ['Belohnung erledigt 🎉', `„${(S.redemptions.find(r => r.id === b.dataset.fr) || {}).title || ''}“ ist abgehakt`]);
  act('[data-dg]', 'decide_diamonds', (b, ok) => ({ p_id: b.dataset.dg, p_ok: ok }),
    (b, ok) => { const g = S.grants.find(x => x.id === b.dataset.dg) || {}; return [ok ? 'Diamanten genehmigt 💎' : 'Diamanten abgelehnt', `+${g.amount} · ${g.reason}`]; });
  act('[data-dd]', 'decide_delete', (b, ok) => ({ p_id: b.dataset.dd, p_ok: ok }),
    (b, ok) => [ok ? 'Löschung bestätigt 🗑️' : 'Löschung abgelehnt', (S.delreqs.find(r => r.id === b.dataset.dd) || {}).label || '']);
  act('[data-cd]', 'cancel_delete', b => ({ p_id: b.dataset.cd }));
  act('[data-cg]', 'cancel_diamonds', b => ({ p_id: b.dataset.cg }));
  $app.querySelectorAll('[data-pu]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const g = pau.find(x => x.key === b.dataset.pu); const ok = b.dataset.ok === '1';
    const { error } = g.group_id
      ? await sb.rpc('decide_pause_group', { p_user: o.id, p_group: g.group_id, p_ok: ok })
      : await sb.rpc('decide_pause', { p_user: o.id, p_day: g.days[0], p_ok: ok });
    if (error) { b.disabled = false; return toast(errMsg(error)); }
    notify(ok ? 'Pause genehmigt 🏖️' : 'Pause abgelehnt', rangeText(g.days));
    await refresh();
  });
  $app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => askDelete(b.dataset.del.split(':')[0], b.dataset.del.split(':')[1]));
  const more = document.getElementById('more');
  if (more) more.onclick = () => { S.histN += 30; renderDuel(); };
}

// Was passiert, wenn die Löschung bestätigt wird?
function delEffect(r) {
  const who = r.target_owner === S.me.id ? 'dich' : nameOf(r.target_owner);
  if (r.kind === 'proof') {
    const p = S.proofs.find(x => x.id === r.target_id);
    return p && p.status === 'approved' ? `−${p.points} Diamanten für ${who}, der Tag zählt dann als nicht erledigt` : 'Ändert keine Diamanten';
  }
  if (r.kind === 'redemption') { const x = S.redemptions.find(y => y.id === r.target_id); return x ? `${x.cost} Diamanten zurück an ${who}` : ''; }
  if (r.kind === 'grant') { const g = S.grants.find(y => y.id === r.target_id); return g && g.status === 'approved' ? `−${g.amount} Diamanten für ${who}` : 'Ändert keine Diamanten'; }
  return '';
}

// Gemeinsamer Verlauf: Beweise, Einlösungen und entschiedene Diamanten-Anträge
function historyItems() {
  const ts = s => new Date(s).getTime();
  return [
    ...S.proofs.map(p => ({ kind:'proof', id:p.id, at:ts(p.created_at), x:p })),
    ...S.redemptions.map(r => ({ kind:'redemption', id:r.id, at:ts(r.created_at), x:r })),
    ...S.grants.filter(g => g.status !== 'pending').map(g => ({ kind:'grant', id:g.id, at:ts(g.decided_at || g.created_at), x:g })),
  ].sort((a, b) => b.at - a.at);
}
function histRow(it) {
  const x = it.x; let main = '', sub = '', tag = '';
  if (it.kind === 'proof') {
    const t = S.tasks.find(y => y.id === x.task_id) || {};
    main = `${esc(nameOf(x.user_id))}: ${esc(t.title)}`;
    sub = `${prettyDate(x.for_date)}, ${tFmt.format(new Date(x.created_at)).slice(0,5)} · ${x.points} <i class="ti ti-diamond"></i>`;
    tag = (x.late ? '<span class="tag no">zu spät</span>' : '') + (x.status === 'approved' ? '<span class="tag ok">bestätigt</span>' : x.status === 'pending' ? '<span class="tag wait">offen</span>' : '<span class="tag no">abgelehnt</span>');
  } else if (it.kind === 'redemption') {
    main = `${esc(nameOf(x.user_id))} kauft: ${esc(x.title)}`;
    sub = `${prettyDate(berlinDate(new Date(x.created_at)))} · −${x.cost} <i class="ti ti-diamond"></i>`;
    tag = x.fulfilled ? '<span class="tag ok">erledigt</span>' : '<span class="tag wait">offen</span>';
  } else {
    main = `${esc(nameOf(x.user_id))} bekommt +${x.amount} <i class="ti ti-diamond gem"></i>`;
    sub = `${esc(x.reason)} · ${prettyDate(berlinDate(new Date(x.created_at)))}`;
    tag = x.status === 'approved' ? '<span class="tag ok">genehmigt</span>' : '<span class="tag no">abgelehnt</span>';
  }
  const del = openDel(it.kind, it.id)
    ? '<span class="tag wait"><i class="ti ti-trash"></i> angefragt</span>'
    : (S.dbOld ? '' : `<button class="iconbtn" data-del="${it.kind}:${it.id}" aria-label="Löschung anfragen"><i class="ti ti-trash"></i></button>`);
  return `<div class="line hrow"><span>${main}<br><span class="muted">${sub}</span></span><span class="r">${tag}${del}</span></div>`;
}
async function askDelete(kind, id) {
  if (!other()) return toast('Erst wenn deine Schwester dabei ist');
  const reason = prompt(`Löschung anfragen – ${oName()} muss zustimmen.\nGrund (optional):`, '');
  if (reason === null) return;
  const { error } = await sb.rpc('request_delete', { p_kind: kind, p_target: id, p_reason: reason });
  if (error) return toast(errMsg(error));
  const r = (await sb.from('delete_requests').select('label').eq('kind', kind).eq('target_id', id).eq('status', 'pending').maybeSingle()).data;
  notify(`${S.me.name} möchte etwas löschen`, (r && r.label ? r.label : 'Eintrag im Verlauf') + ' – bitte bestätigen');
  toast(`Angefragt – ${oName()} muss zustimmen`); await refresh();
}

    return `<div class="card"><div class="line"><span class="t">${esc(r.title)}</span><span class="pill gem"><i class="ti ti-diamond"></i>${r.cost}</span></div>
      ${r.approved ? `<div style="background:var(--gray);border-radius:8px;height:12px;margin:10px 0"><div style="width:${pct}%;height:12px;border-radius:8px;background:var(--amber)"></div></div>
        <div class="row2"><button class="btn ghost small" data-ar="${r.id}">Entfernen</button><button class="btn ${bal >= r.cost ? '' : 'blue'} small" data-rd="${r.id}">${bal >= r.cost ? 'Einlösen' : `noch ${r.cost - bal}`}</button></div>`
      : `<p style="margin-top:6px"><span class="tag wait">wartet auf Preis-OK</span></p>`}</div>`;
  }).join('');
  html += `<h2>Neue Belohnung</h2>
    <label>Was willst du?</label><input id="rt" maxlength="60" placeholder="Kino, Pizza aussuchen, …">
    <label>Preis in Punkten</label><input id="rc" type="number" min="1" max="100000" inputmode="numeric" placeholder="300">
    <button class="btn blue" id="addR">Vorschlagen</button>
    <p class="muted" style="margin-top:8px">Die andere Person bestätigt den Preis.</p>`;

    html += `<h2>Diamanten anfragen</h2>
      <p class="muted" style="margin-bottom:6px">Aus Versehen das Falsche eingelöst, Bonus verdient oder ${o ? esc(o.name) : 'deiner Schwester'} was schenken? ${o ? esc(o.name) : 'Die andere Person'} muss zustimmen.</p>
      <label>Für wen?</label><select id="gTo"><option value="${S.me.id}">Für mich</option>${o ? `<option value="${o.id}">Für ${esc(o.name)} (Geschenk)</option>` : ''}</select>
      <label>Wie viele Diamanten?</label><input id="gA" type="number" min="1" max="100000" inputmode="numeric" placeholder="50">
      <label>Grund</label><input id="gR" maxlength="120" placeholder="Falsch eingelöst, Bonus, …">
      <button class="btn blue" id="addG">Anfragen</button>`
      + myG.map(g => `<div class="line hrow"><span>${g.user_id === S.me.id ? 'Für dich' : 'Für ' + esc(nameOf(g.user_id))}: ${esc(g.reason)}<br><span class="muted">+${g.amount} Diamanten</span></span>${g.status === 'approved' ? '<span class="tag ok">genehmigt</span>' : g.status === 'pending' ? '<span class="tag wait">wartet</span>' : '<span class="tag no">abgelehnt</span>'}</div>`).join('');
  } else html += dbHint();
  const myRed = S.redemptions.filter(r => r.user_id === S.me.id);
  if (myRed.length) html += `<h2>Eingelöst</h2>` + (S.dbOld ? '' : `<p class="muted" style="margin:-4px 0 4px">Falsch eingelöst? „Zurück“ fragt an, ob du die Diamanten zurückbekommst.</p>`)
    + myRed.slice(0, 20).map(r => `<div class="line hrow"><span>${esc(r.title)} <span class="muted">(${r.cost})</span></span><span class="r">${r.fulfilled ? '<span class="tag ok">erledigt</span>' : '<span class="tag wait">offen</span>'}${S.dbOld ? '' : openDel('redemption', r.id) ? '<span class="tag wait">Rückgabe angefragt</span>' : `<button class="btn ghost small" data-back="${r.id}">Zurück</button>`}</span></div>`).join('');
  $app.innerHTML = html;
  $app.querySelectorAll('[data-back]').forEach(b => b.onclick = () => askDelete('redemption', b.dataset.back));
  const addG = document.getElementById('addG');
  if (addG) addG.onclick = async () => {
    if (!o) return toast('Erst wenn deine Schwester dabei ist');
    const to = document.getElementById('gTo').value; const amount = parseInt(document.getElementById('gA').value, 10);
    const reason = document.getElementById('gR').value.trim();
    if (!(amount >= 1 && amount <= 100000)) return toast('Anzahl zwischen 1 und 100000');
    if (!reason) return toast('Gib kurz einen Grund an');
    addG.disabled = true;

    if (error) return toast(errMsg(error));

    if (!confirm(`„${r.title}“ für ${r.cost} Punkte einlösen?`)) return;
    const { error } = await sb.rpc('redeem', { p_reward: r.id }); if (error) return toast(errMsg(error));
    notify(`${S.me.name} hat eingelöst 🎁`, `„${r.title}“ für ${r.cost} Diamanten`);
    toast('Eingelöst! Die andere Person sieht es im Duell.'); await refresh();
  });
  $app.querySelectorAll('[data-ar]').forEach(b => b.onclick = async () => {
    const { error } = await sb.rpc('archive_reward', { p_id: b.dataset.ar }); if (error) return toast(errMsg(error)); await refresh();
  });
  document.getElementById('addR').onclick = async () => {
    const title = document.getElementById('rt').value.trim(); const cost = parseInt(document.getElementById('rc').value, 10);
    if (!title) return toast('Wie heißt die Belohnung?');
    if (!(cost >= 1 && cost <= 100000)) return toast('Preis zwischen 1 und 100000');
    const { error } = await sb.from('rewards').insert({ title, cost, owner: S.me.id }); if (error) return toast(errMsg(error));
    notify(`Neue Belohnung von ${S.me.name}`, `„${title}“ für ${cost} Diamanten – Preis okay?`);
    toast('Vorgeschlagen'); await refresh();
  };
}

function renderMe() {
  const today = berlinDate();
  const mine = S.tasks.filter(t => t.owner === S.me.id && !t.archived_at);
  const pauses = S.pauses.filter(p => p.user_id === S.me.id && p.day >= today);
  let html = topbar() + `<h2 style="margin-top:4px">${esc(S.me.name)}</h2><h2>Deine Challenges</h2>`;
  if (!mine.length) html += `<div class="empty">Noch keine Challenges.</div>`;
  html += mine.map(t => `<div class="card"><div class="line"><span class="t">${esc(t.title)}</span><span class="pill gem"><i class="ti ti-diamond"></i>${t.points}</span></div>
      <p class="muted">${esc(repeatText(t))}</p>${t.proof_hint ? `<p class="muted">Beweis: ${esc(t.proof_hint)}</p>` : ''}
      <div class="line" style="margin-top:8px">${t.approved ? '<span class="tag ok">aktiv</span>' : '<span class="tag wait">wartet auf OK</span>'}<button class="btn ghost small" data-at="${t.id}">Beenden</button></div></div>`).join('');
  html += `<h2>Neue Challenge</h2>
    <label>Was?</label><input id="tt" maxlength="60" placeholder="Pünktlich in der Schule">
    <div class="row2"><div><label>Punkte</label><input id="tp" type="number" min="1" max="100" value="5" inputmode="numeric"></div>
    <div><label>Uhrzeit (optional)</label><input id="tz" type="time"></div></div>
    <label>Was zählt als Beweis?</label><input id="th" maxlength="120" placeholder="Foto im Klassenraum">
    <label>Wie oft?</label>
    <select id="tr"><option value="daily">Jeden Tag</option><option value="weekdays" selected>Bestimmte Wochentage</option><option value="once">Nur an einem Datum</option><option value="interval">Alle X Tage (z.B. alle 2 Wochen = 14)</option></select>
    <div id="wdBox" class="wd">${DAYS.map((d, i) => `<label><input type="checkbox" value="${i + 1}" ${i < 5 ? 'checked' : ''}><span>${d}</span></label>`).join('')}</div>
    <div id="dBox"><label id="dLabel">Ab wann?</label><input id="td" type="date" value="${today}" min="${today}"></div>
    <div id="iBox" class="hidden"><label>Alle wie viele Tage?</label><input id="ti" type="number" min="1" max="365" value="14" inputmode="numeric"></div>
    <button class="btn blue" id="addT">Vorschlagen</button>
    <p class="muted" style="margin-top:8px">Die andere Person bestätigt neue Challenges, damit keiner sich Punkte schenkt.</p>
    <h2>Pause-Tage</h2><p class="muted" style="margin-bottom:6px">Ferien, krank – der Streak geht nicht verloren. Ein Tag oder mehrere am Stück, nur ab heute. Die andere Person stimmt einmal für den ganzen Zeitraum zu.</p>
    <div class="row2"><div><label>Von</label><input id="pd" type="date" value="${today}" min="${today}"></div>
    <div><label>Bis (für mehrere Tage)</label><input id="pd2" type="date" min="${today}"></div></div>
    <button class="btn blue" id="addP">Pause beantragen</button><div style="height:6px"></div>
    ${groupPauses(pauses).map(g => `<div class="line hrow"><span>${esc(rangeText(g.days))} ${g.approved ? '<span class="tag ok">ok</span>' : '<span class="tag wait">wartet</span>'}</span><button class="btn ghost small" data-dp="${esc(g.key)}">Löschen</button></div>`).join('')}
    <h2>Benachrichtigungen</h2><div id="pushBox"><p class="muted">Prüfe …</p></div>
    <h2>Sonstiges</h2><p class="muted">Beweisfotos werden 3 Tage nach der Prüfung gelöscht. Zeit, Ort und Punkte bleiben.</p>
    <div style="height:12px"></div><button class="btn ghost" id="out">Abmelden</button>`;
  $app.innerHTML = html;
  const tr = document.getElementById('tr');
  const sync = () => {
    const v = tr.value;
    document.getElementById('wdBox').classList.toggle('hidden', v !== 'weekdays');
    document.getElementById('iBox').classList.toggle('hidden', v !== 'interval');
    document.getElementById('dLabel').textContent = v === 'once' ? 'An welchem Tag?' : 'Ab wann?';
  };
  tr.onchange = sync; sync();
  document.getElementById('addT').onclick = async () => {
    const title = document.getElementById('tt').value.trim();
    const points = parseInt(document.getElementById('tp').value, 10);
    const repeat = tr.value;
    const weekdays = [...document.querySelectorAll('#wdBox input:checked')].map(i => +i.value);
    const start_date = document.getElementById('td').value || today;
    const every_days = parseInt(document.getElementById('ti').value, 10);
    const due_time = document.getElementById('tz').value || null;
    if (!title) return toast('Wie heißt die Challenge?');
    if (!(points >= 1 && points <= 100)) return toast('Punkte zwischen 1 und 100');
    if (repeat === 'weekdays' && !weekdays.length) return toast('Mindestens einen Wochentag wählen');
    if (repeat === 'interval' && !(every_days >= 1 && every_days <= 365)) return toast('Abstand zwischen 1 und 365 Tagen');
    if (start_date < today) return toast('Datum liegt in der Vergangenheit');
    const row = { title, points, repeat, start_date, due_time, owner: S.me.id,
      proof_hint: document.getElementById('th').value.trim() || null,
      weekdays: repeat === 'weekdays' ? weekdays : null,
      every_days: repeat === 'interval' ? every_days : null };
    const { error } = await sb.from('tasks').insert(row); if (error) return toast(errMsg(error));
    notify(`Neue Challenge von ${S.me.name}`, `„${title}“ (${points} Diamanten) – passt das?`);
    toast('Vorgeschlagen – wartet auf OK'); await refresh();
  };
  $app.querySelectorAll('[data-at]').forEach(b => b.onclick = async () => {
    if (!confirm('Challenge beenden?')) return;
    const { error } = await sb.rpc('archive_task', { p_id: b.dataset.at }); if (error) return toast(errMsg(error)); await refresh();
  });
  document.getElementById('addP').onclick = async () => {
    const from = document.getElementById('pd').value; const to = document.getElementById('pd2').value || from;
    if (!from) return toast('Von wann?');
    if (from < today) return toast('Pause-Tage nur ab heute');
    if (to < from) return toast('„Bis“ liegt vor „Von“');
    const n = diffDays(from, to) + 1;
    if (n > 90) return toast('Höchstens 90 Tage am Stück');
    const have = new Set(S.pauses.filter(p => p.user_id === S.me.id).map(p => p.day));
    const days = []; for (let i = 0; i < n; i++) { const d = addDays(from, i); if (!have.has(d)) days.push(d); }
    if (!days.length) return toast(n === 1 ? 'Ist schon ein Pause-Tag' : 'Sind schon alles Pause-Tage');
    if (n > 1 && !confirm(`${rangeText(days)} als Pause beantragen?`)) return;
    const group_id = crypto.randomUUID();
    const rows = days.map(day => S.dbOld ? { day, user_id: S.me.id } : { day, user_id: S.me.id, group_id });
    const { error } = await sb.from('pause_days').insert(rows);
    if (error) return toast(error.code === '23505' ? 'Ist schon ein Pause-Tag' : errMsg(error));
    notify(`${S.me.name} möchte Pause 🏖️`, `${rangeText(days)} – bitte bestätigen`);
    toast('Wartet auf OK'); await refresh();
  };
  $app.querySelectorAll('[data-dp]').forEach(b => b.onclick = async () => {
    const g = groupPauses(pauses).find(x => x.key === b.dataset.dp); if (!g) return;
    if (g.days.length > 1 && !confirm(`Pause ${rangeText(g.days)} löschen?`)) return;
    const { error } = await sb.from('pause_days').delete().eq('user_id', S.me.id).in('day', g.days); if (error) return toast(errMsg(error)); await refresh();
  });
  document.getElementById('out').onclick = async () => { await pushOff(true); sb.auth.signOut(); };
  renderPushBox();
}

// ---------- Push-Benachrichtigungen ----------
const b64uToBytes = s => { const b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
let swReg = null;
async function getReg() {
  if (swReg) return swReg;
  if (!('serviceWorker' in navigator)) return null;
  try { swReg = await navigator.serviceWorker.register('sw.js'); return swReg; } catch (_) { return null; }
}
async function currentSub() { const r = await getReg(); return r && r.pushManager ? r.pushManager.getSubscription() : null; }
async function saveSub(sub) {
  const j = sub.toJSON();
  const { error } = await sb.rpc('save_push_subscription', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
  if (error) throw error;
}
async function pushOn() {
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('Benachrichtigungen nicht erlaubt');
  const reg = await getReg(); if (!reg) throw new Error('Service Worker fehlt');
  await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(VAPID_PUBLIC_KEY) });
  await saveSub(sub);
}
async function pushOff(quiet) {
  try {
    const sub = await currentSub(); if (!sub) return;
    await sb.rpc('remove_push_subscription', { p_endpoint: sub.endpoint });
    await sub.unsubscribe();
  } catch (e) { if (!quiet) toast(errMsg(e)); }
}
async function renderPushBox() {
  const box = document.getElementById('pushBox'); if (!box) return;
  if (!pushSupported()) {
    box.innerHTML = isIOS() && !isStandalone()
      ? `<p class="muted">Auf dem iPhone gehen Benachrichtigungen nur in der App vom Home-Bildschirm: in Safari <b>Teilen → Zum Home-Bildschirm</b>, dann die App dort öffnen (iOS 16.4 oder neuer).</p>`
      : `<p class="muted">Dieser Browser kann keine Push-Benachrichtigungen.</p>`;
    return;
  }
  if (Notification.permission === 'denied') {
    box.innerHTML = `<p class="muted">Benachrichtigungen sind blockiert. iPhone: <b>Einstellungen → Mitteilungen → Streako</b> → erlauben.</p>`; return;
  }
  const sub = await currentSub().catch(() => null);
  if (sub && Notification.permission === 'granted') {
    box.innerHTML = `<p style="margin-bottom:8px"><span class="tag ok">an</span> <span class="muted">auf diesem Gerät – du bekommst Bescheid, wenn ${esc(oName())} etwas einreicht oder entscheidet, und um 19 Uhr, falls noch etwas offen ist.</span></p>
      <div class="row2"><button class="btn ghost small" id="pTest">Test senden</button><button class="btn ghost small" id="pOff">Ausschalten</button></div>`;
    document.getElementById('pTest').onclick = async () => {
      const { data, error } = await sb.functions.invoke('push', { body: { title: 'Streako', body: 'Test – Benachrichtigungen funktionieren 🔥', to: 'self' } });
      if (error) return toast('Push-Server antwortet nicht – ist die Edge Function „push“ eingerichtet?');
      toast(data && data.sent ? 'Gesendet – kommt gleich an' : 'Kein Gerät gefunden');
    };
    document.getElementById('pOff').onclick = async () => { await pushOff(); renderPushBox(); };
  } else {
    box.innerHTML = `<p class="muted" style="margin-bottom:8px">Bekomm Bescheid, wenn ${esc(oName())} etwas einreicht oder du prüfen musst – und abends, wenn dein Streak in Gefahr ist.</p>
      <button class="btn blue" id="pOn"><i class="ti ti-bell"></i> Benachrichtigungen aktivieren</button>`;
    const pOn = document.getElementById('pOn');
    pOn.onclick = async () => {
      pOn.disabled = true;
      try { await pushOn(); toast('Benachrichtigungen sind an'); } catch (err) { toast(errMsg(err)); }
      renderPushBox();
    };
  }
}

// ---------- Kamera-Beweis ----------
const CAM = { stream:null, watch:null, pos:null, blob:null, task:null };
function closeCamera() {
  if (CAM.stream) CAM.stream.getTracks().forEach(t => t.stop());
  if (CAM.watch !== null) navigator.geolocation.clearWatch(CAM.watch);
  Object.assign(CAM, { stream:null, watch:null, pos:null, blob:null, task:null });
  $modal.classList.add('hidden'); $modal.innerHTML = '';
}
function gpsText() {
  if (!CAM.pos) return '<i class="ti ti-map-pin"></i> GPS sucht …';
  return `<i class="ti ti-map-pin"></i> GPS ±${Math.round(CAM.pos.accuracy)} m`;
}
async function openCamera(task) {
  CAM.task = task;
  $modal.classList.remove('hidden');
  $modal.innerHTML = `
    <div class="line"><button class="btn ghost small" id="cx" aria-label="Schließen"><i class="ti ti-x"></i></button><b style="font-size:17px">${esc(task.title)}</b><span class="pill gem"><i class="ti ti-diamond"></i>+${task.points}</span></div>
    ${task.proof_hint ? `<p class="muted center" style="margin-top:6px">Beweis: ${esc(task.proof_hint)}</p>` : ''}
    <div class="cam" id="cam">
      <video id="vid" playsinline muted autoplay></video>
      <img id="prev" class="hidden" alt="Vorschau">
      <div class="hud"><span><i class="ti ti-clock"></i> Zeit setzt der Server</span><span id="gps">${gpsText()}</span></div>
      <button class="shutter" id="shot" aria-label="Foto aufnehmen"></button>
    </div>
    <p class="muted center" style="margin-bottom:10px">Nur Live-Kamera – kein Upload aus der Galerie.</p>
    <div id="after" class="row2 hidden"><button class="btn ghost" id="again">Nochmal</button><button class="btn" id="send">Beweis senden</button></div>`;
  document.getElementById('cx').onclick = closeCamera;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Kamera wird hier nicht unterstützt (HTTPS nötig)'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1280 } }, audio:false });
    if (CAM.task !== task) { stream.getTracks().forEach(t => t.stop()); return; }
    CAM.stream = stream;
    const v = document.getElementById('vid'); v.srcObject = CAM.stream; await v.play().catch(() => {});
  } catch (e) { toast('Kamera nicht erlaubt – in den Einstellungen freigeben'); return; }
  if ('geolocation' in navigator) {
    CAM.watch = navigator.geolocation.watchPosition(
      pos => { CAM.pos = pos.coords; const g = document.getElementById('gps'); if (g) g.innerHTML = gpsText(); },
      () => { const g = document.getElementById('gps'); if (g) g.innerHTML = '<i class="ti ti-map-pin-off"></i> Standort aus'; },
      { enableHighAccuracy:true, maximumAge:0, timeout:30000 });
  }
  document.getElementById('shot').onclick = () => {
    const v = document.getElementById('vid');
    if (!v.videoWidth) return toast('Kamera startet noch …');
    const scale = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement('canvas'); c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    c.toBlob(b => {
      if (!b) return toast('Foto ging nicht – nochmal');
      CAM.blob = b;
      const img = document.getElementById('prev'); img.src = URL.createObjectURL(b);
      img.classList.remove('hidden'); v.classList.add('hidden');
      document.getElementById('shot').classList.add('hidden'); document.getElementById('after').classList.remove('hidden');
    }, 'image/jpeg', 0.75);
  };
  document.getElementById('again').onclick = () => {
    CAM.blob = null;
    document.getElementById('prev').classList.add('hidden'); document.getElementById('vid').classList.remove('hidden');
    document.getElementById('shot').classList.remove('hidden'); document.getElementById('after').classList.add('hidden');
  };
  document.getElementById('send').onclick = async () => {
    const btn = document.getElementById('send');
    if (!CAM.blob) return;
    if (!CAM.pos) return toast('Warte kurz, bis GPS da ist (Standort muss erlaubt sein)');
    if (CAM.pos.accuracy > 150) return toast(`GPS noch ungenau (±${Math.round(CAM.pos.accuracy)} m) – kurz warten oder nach draußen/ans Fenster`);
    btn.disabled = true; btn.textContent = 'Sendet …';
    const path = `${S.me.id}/${crypto.randomUUID()}.jpg`;
    const up = await sb.storage.from('proofs').upload(path, CAM.blob, { contentType:'image/jpeg', upsert:false });
    if (up.error) { btn.disabled = false; btn.textContent = 'Beweis senden'; return toast(errMsg(up.error)); }
    const { data, error } = await sb.from('proofs').insert({
      task_id: CAM.task.id, photo_path: path, user_id: S.me.id,
      lat: CAM.pos.latitude, lng: CAM.pos.longitude, accuracy: CAM.pos.accuracy,
      for_date: berlinDate(), points: CAM.task.points,
    }).select().single();
    if (error) {
      await sb.storage.from('proofs').remove([path]);
      btn.disabled = false; btn.textContent = 'Beweis senden';
      return toast(error.code === '23505' ? 'Für heute schon eingereicht' : errMsg(error) + (/nicht dran/.test(errMsg(error)) ? ' (nach Mitternacht zählt der neue Tag)' : ''));
    }
    notify(`${S.me.name} hat „${CAM.task.title}“ erledigt 📸`, 'Beweis wartet auf deine Prüfung');
    document.getElementById('after').outerHTML = `<div class="success"><i class="ti ti-confetti"></i> Stark! Eingereicht um ${tFmt.format(new Date(data.created_at))} Uhr</div>`;
    setTimeout(async () => { closeCamera(); await refresh(); }, 1600);
  };
}

// ---------- Start ----------
let busy = false, again = false;
async function refresh() {
  if (busy) { again = true; return; }
  busy = true;
  try { if (S.session) await loadAll(); render(); }
  catch (e) {
    $nav.classList.add('hidden');
    $app.innerHTML = `<div class="card" style="margin-top:30px"><p class="t">Laden hat nicht geklappt</p><p class="muted" style="margin:6px 0 12px">${esc(errMsg(e))}</p>
      <button class="btn" id="retry">Nochmal</button><div style="height:10px"></div><button class="btn ghost" id="eout">Abmelden</button></div>`;
    document.getElementById('retry').onclick = () => refresh();
    document.getElementById('eout').onclick = () => sb.auth.signOut();
  }
  finally { busy = false; if (again) { again = false; await refresh(); } }
}
$nav.querySelectorAll('button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; window.scrollTo(0, 0); render(); if (S.tab === 'home' || S.tab === 'duel') refresh(); });

let started = false;
sb.auth.onAuthStateChange((_ev, session) => {
  const changed = !started || (session && session.user.id) !== (S.session && S.session.user.id);
  started = true;
  S.session = session;
  if (changed) { S.me = null; S.tab = 'home'; S.histN = 15; setTimeout(() => refresh().then(() => { if (S.me) { cleanupPhotos(); resyncPush(); } }), 0); }
});
// Vorhandenes Push-Abo diesem Account zuordnen (z. B. nach Account-Wechsel auf dem Gerät)
async function resyncPush() {
  try { if (pushSupported() && Notification.permission === 'granted') { const s = await currentSub(); if (s) await saveSub(s); } } catch (_) {}
}
getReg();
// Kommt eine Push-Nachricht, während die App offen ist: gleich neu laden
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data === 'refresh' && autoOk()) refresh(); });
// Automatisch neu laden – aber nicht, während jemand tippt oder ein Formular offen ist
function autoOk() {
  const a = document.activeElement;
  return document.visibilityState === 'visible' && $modal.classList.contains('hidden') && S.me
    && !(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) && (S.tab === 'home' || S.tab === 'duel');
}
setInterval(() => { if (autoOk()) refresh(); }, 30000);
document.addEventListener('visibilitychange', () => { if (autoOk()) refresh(); });
</script>
